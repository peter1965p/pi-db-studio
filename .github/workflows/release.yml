# Dateinamen ohne Version: So zeigen die Download-Links im README (releases/latest/download/…) immer auf die neueste.
# Baut Pi DB Studio für Linux (AppImage, tar.gz) und Windows (Setup.exe, ZIP), sobald ein Tag v* gepusht wird,
# prüft jedes Paket mit --selbsttest und hängt die Dateien an das GitHub-Release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04   # ältere glibc → läuft auf allen aktuellen Distributionen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Systempakete (Qt braucht xcb, AppImage braucht FUSE nur zum Starten)
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libegl1 libfuse2 file
      - name: Abhängigkeiten
        run: pip install -r requirements.txt -r requirements-web.txt "pyinstaller>=6.10"   # Web nur für die Tests; das Paket schließt es aus
      - name: Tests (informativ – die volle Suite läuft vor jedem Tag lokal, hier entscheidet der Selbsttest des Pakets)
        continue-on-error: true
        run: QT_QPA_PLATFORM=offscreen python -m pytest -q -p no:cacheprovider -k "not postgres and not mysql and not mssql"
      - name: Paket bauen
        run: pyinstaller packaging/pi-db-studio.spec --noconfirm
      - name: Selbsttest des Pakets
        run: QT_QPA_PLATFORM=offscreen dist/PiDBStudio/PiDBStudio --selbsttest
      - name: AppImage und tar.gz
        run: |
          VERSION=$(python -c "import dbstudio; print(dbstudio.__version__)")
          mkdir -p AppDir/usr/lib AppDir/usr/share/icons/hicolor/256x256/apps
          cp -r dist/PiDBStudio AppDir/usr/lib/
          cp packaging/appimage/AppRun AppDir/ && chmod +x AppDir/AppRun
          cp packaging/appimage/pi-db-studio.desktop AppDir/
          cp dbstudio/icon.png AppDir/pi-db-studio.png
          cp dbstudio/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/pi-db-studio.png
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir "dist/PiDBStudio-Linux-x86_64.AppImage"
          tar -C dist -czf "dist/PiDBStudio-Linux-x86_64.tar.gz" PiDBStudio
          ( cd dist && sha256sum PiDBStudio-*.AppImage PiDBStudio-*.tar.gz > SHA256SUMS-Linux.txt )
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.AppImage
            dist/*.tar.gz
            dist/SHA256SUMS-Linux.txt

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten
        run: pip install -r requirements.txt -r requirements-web.txt "pyinstaller>=6.10"   # Web nur für die Tests; das Paket schließt es aus
      - name: Tests (informativ – entscheidend ist der Selbsttest des Pakets)
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -p no:cacheprovider -k "not postgres and not mysql and not mssql"
      - name: Paket bauen
        run: pyinstaller packaging/pi-db-studio.spec --noconfirm
      - name: Selbsttest des Pakets
        env:
          QT_QPA_PLATFORM: offscreen
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\PiDBStudio\PiDBStudio.exe -ArgumentList "--selbsttest" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "Selbsttest fehlgeschlagen ($($p.ExitCode))" }
      - name: Setup.exe und ZIP
        shell: pwsh
        run: |
          $v = python -c "import dbstudio; print(dbstudio.__version__)"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVersion=$v" packaging\windows\pi-db-studio.iss
          Compress-Archive -Path dist\PiDBStudio -DestinationPath "dist\PiDBStudio-Windows-x64-portabel.zip"
          Get-FileHash dist\PiDBStudio-*.exe, dist\PiDBStudio-*.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Out-File -Encoding ascii dist\SHA256SUMS-Windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS-Windows.txt

  release:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: pakete
          merge-multiple: true
      - name: Release anlegen bzw. ergänzen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          awk -v v="$VERSION" '$0 ~ "^## "v" " {an=1; next} /^## / && an {exit} an' CHANGELOG.md > notizen.md
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Pi DB Studio $VERSION" --notes-file notizen.md
          gh release upload "$TAG" pakete/* --clobber
